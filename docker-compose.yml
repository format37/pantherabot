services:
  server:
    container_name: panthera_gptaidbot
    command: ["uvicorn", "server:app", "--host", "127.0.0.1", "--port", "4221"]
    restart: always
    volumes:
      # - /etc/localtime:/etc/localtime:ro
      # - /etc/timezone:/etc/timezone:ro
      - ./data:/server/data
      - ./config.json:/server/config.json
      # CLAUDE_HOME must be set (in .env or by compose.sh) — never use `~` here:
      # under plain sudo, ~ expands to /root and silently mounts wrong state.
      - ${CLAUDE_HOME:?set CLAUDE_HOME in .env or deploy via compose.sh}/.claude:/home/appuser/.claude
      - ${CLAUDE_HOME:?set CLAUDE_HOME in .env or deploy via compose.sh}/.claude.json:/home/appuser/.claude.json
      - type: bind
        source: /mnt/${BOT_TOKEN_WITHOUT_PREFIX}
        target: /${BOT_TOKEN_WITHOUT_PREFIX}
    cap_add:
      - DAC_READ_SEARCH
    build: server
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    network_mode: host
    environment:
      - TZ=America/Los_Angeles
      - WOLFRAM_ALPHA_APPID=${WOLFRAM_ALPHA_APPID}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - BOT_USERNAME=${BOT_USERNAME}
      - PERPLEXITY_MCP_URL=${PERPLEXITY_MCP_URL}